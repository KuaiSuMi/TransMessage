name: Windows build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore, format, build, test and audit
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Package self-contained Windows x64
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test published CLI
        shell: pwsh
        run: |
          $env:TM_TEST_EXE = (Get-Content dist/build-info.json | ConvertFrom-Json).executable
          dotnet test tests/TransMessage.Tests --no-build --filter FullyQualifiedName~CliIntegrationTests --logger 'trx;LogFileName=published.trx' --results-directory artifacts/test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TransMessage-win-x64
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            artifacts/test-results
            artifacts/gui/*.png
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TransMessage-win-x64
          path: dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content dist/build-info.json | ConvertFrom-Json).version
          if ('${{ github.ref_name }}' -ne "v$version") { throw 'Tag must match the compiled release version.' }
          gh release create '${{ github.ref_name }}' dist/TransMessage-win-x64.zip dist/SHA256SUMS --repo '${{ github.repository }}' --verify-tag --generate-notes
